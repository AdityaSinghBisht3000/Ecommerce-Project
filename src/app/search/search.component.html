<div *ngIf="searchResult && searchResult.length > 0">
  <div class="row search-item" *ngFor="let item of searchResult">
    <div class="col-sm-3">
      <a routerLink="/details/{{item.id}}">  <img src="{{item.image}}" alt=""></a>
    </div>
    <div class="col-sm-8 details">
      <h6>  <a routerLink="/details/{{item.id}}"> {{item.name}} </a></h6>
      <p><b>Price:{{item.price}}</b></p>
      <p><span>Color:{{item.color}}</span><span>Category: {{item.catagory}}</span></p>
      <p>{{item.description}}</p>
    </div>
  </div>
</div>
<div *ngIf="!searchResult || searchResult.length === 0">
    <h1 style="color:red; margin:311px">No item found</h1>
</div>
