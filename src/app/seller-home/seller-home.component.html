<div class="product-list">
  <h1>Product List</h1>
  <p class="message-p">{{ productMessage }}</p>
  <p class="message-p" style="color: red;">{{ deleteProductMessage }}</p>
  <table style="margin-bottom: 100px;">
    <thead >
      <tr>
        <th>Image</th>
        <th>Name</th>
        <th>Price</th>
        <th>Color</th>
        <th>Category</th>
        <th>Description</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of productList">
        <td><img src="{{ item.image }}" /></td>
        <td>{{ item.name }}</td>
        <td>{{ item.price }}</td>
        <td>{{ item.color }}</td>
        <td>{{ item.category }}</td>
        <td>{{ item.description }}</td>
        <td>
          <fa-icon (click)="deleteProduct(item.id,item.name)" [icon]="icon" style="cursor: pointer;"></fa-icon>
          <a class="adjust-update-link" routerLink='/seller-update-product/{{item.id}}' style="cursor: pointer;"> <fa-icon style="color: blueviolet;" [icon]="iconEdit"></fa-icon></a>
        </td>
      </tr>
    </tbody>
  </table>
</div>
