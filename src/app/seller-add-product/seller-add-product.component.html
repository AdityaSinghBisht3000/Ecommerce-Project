<div class="add-product">
<h1>Add new Product</h1>
<form #addProduct="ngForm" class="common-form" (ngSubmit)="AddProduct(addProduct.value)">
 <input
        type="text"
        class="form-input"
        placeholder="Enter Product Name"
        name="name"
        ngModel
      />
 <input
        type="text"
        class="form-input"
        placeholder="Enter Product Price"
        name="price"
        ngModel
      />
 <input
        type="text"
        class="form-input"
        placeholder="Enter Product Colour"
        name="color"
        ngModel
      />
 <input
        type="text"
        class="form-input"
        placeholder="Enter Product Catagory"
        name="catagory"
        ngModel
      />
 <textarea style="height: 50px;"
        type="text"
        class="form-input"
        placeholder="Enter Product Description"
        name="description"
        ngModel
      ></textarea>
  <input
        type="text"
        class="form-input"
        placeholder="Enter Product Image URL"
        name="img"
        ngModel
      />     
  <button class="form-button" >Add Product</button>
</form>
</div>
